services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: mc173orchestrator
      POSTGRES_USER: mc
      POSTGRES_PASSWORD: mc
    ports:
      - "6000:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mc -d mc173orchestrator"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
